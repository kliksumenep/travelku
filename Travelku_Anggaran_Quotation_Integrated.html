  const decodeHTML = (b64) => new TextDecoder("utf-8").decode(
    Uint8Array.from(atob(b64), c => c.charCodeAt(0))
  );
  const anggaran = document.getElementById("halaman-anggaran");
  const dokumen = document.getElementById("halaman-dokumen");
  let dokumenSiap = false;

  function tampilAnggaran() {
    dokumen.classList.remove("aktif");
    anggaran.classList.add("aktif");
  }
  function tampilQuotation() {
    anggaran.classList.remove("aktif");
    dokumen.classList.add("aktif");
    if (!dokumenSiap) return;
    const tombol = dokumen.contentDocument.querySelector('[data-act="buka-tab"][data-tab="qt"]');
    if (tombol) tombol.click();
  }

  anggaran.srcdoc = decodeHTML(ANGGARAN_B64);
  dokumen.addEventListener("load", () => {
    dokumenSiap = true;
    if (location.hash === "#quotation") tampilQuotation();
  });
  dokumen.srcdoc = decodeHTML(DOKUMEN_B64);
  tampilAnggaran();

  window.addEventListener("message", (event) => {
    if (event.source !== anggaran.contentWindow) return;
    const data = event.data;
    if (!data || data.type !== "travelku-open-doc" || data.tab !== "qt") return;
    if (location.hash !== "#quotation") history.pushState({ travelkuPage:"quotation" }, "", "#quotation");
    tampilQuotation();
  });
  window.addEventListener("popstate", () => {
    if (location.hash === "#quotation") tampilQuotation();
    else tampilAnggaran();
  });
})();
</script>
